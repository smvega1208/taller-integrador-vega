<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Calculadora de promedio</title>
    <link rel="stylesheet" href="Estilos Del Sitio.CSS">
</head>
<body>

    <div class="cont1">
        <h1>Calculadora de Promedio</h1>
        <p>Ingrese las tres notas del corte para calcular el promedio.</p>

        <label>Nota 1:</label>
        <input type="number" id="nota1" step="0.1">

        <label>Nota 2:</label>
        <input type="number" id="nota2" step="0.1">

        <label>Nota 3:</label>
        <input type="number" id="nota3" step="0.1">

        <button onclick="calcularPromedio()">Calcular</button>

        <p id="r"></p>
        <p id="r2"></p>
    </div>

<script>

let promedio = 0;
let cantidadNotas = 3;

function calcularPromedio() {

    let a = parseFloat(document.getElementById("nota1").value);
    let b = parseFloat(document.getElementById("nota2").value);
    let c = parseFloat(document.getElementById("nota3").value);


    if (isNaN(nota1) || isNaN(nota2) || isNaN(nota3)) {
        document.getElementById("r").innerHTML = "Debe ingresar las tres notas.";
        return;
    }

    promedio = (nota1 + nota2 + nota3) / cantidadNotas;

    document.getElementById("r").innerHTML = "Promedio: " + promedio.toFixed(2);

    if (promedio >= 3.0) {
        document.getElementById("r2").innerHTML = "Resultado: aprobado";
    } else {
        document.getElementById("r2").innerHTML = "Resultado: reprobado";
    }

}



</script>

</body>
</html>
